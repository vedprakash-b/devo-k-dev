[project]
name = "devokdev"
version = "0.0.1"
description = "Devo-K-Dev: an AI engineering team that plans with you, runs a multi-agent task graph on durable execution, and routes across free LLM providers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ved" }]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "temporalio>=1.34,<2",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "typer>=0.27,<1",
    "rich>=13.9",
    "redis>=8.1,<9",
    "psycopg[binary]>=3.3,<4",
    "structlog>=26.1",
]

[project.scripts]
devokdev = "devokdev.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "hypothesis>=6.152",
    "pre-commit>=4.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devokdev"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear: likely bugs
    "UP",       # modern syntax
    "SIM",      # simplifications
    "C4",       # comprehensions
    "N",        # naming
    "ASYNC",    # async pitfalls
    "S",        # bandit security checks
    "PT",       # pytest style
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# asserts and throwaway credentials are normal in tests
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["devokdev"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: needs the local stack (make up); run with --run-integration",
]

[tool.coverage.run]
source = ["devokdev"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
